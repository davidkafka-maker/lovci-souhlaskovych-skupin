function grade(s){if(s>=29)return 1;if(s>=27)return 2;if(s>=25)return 3;if(s>=23)return 4;return 5}
function finishTest(){clearTimer();state.screen='finish';const z=state.cheated?6:grade(state.score);sendResult(z,30,'TEST');render(`<div class="card"><h1 class="title">VÝSLEDEK</h1><div class="result"><b>${esc(state.name)}</b> • ${esc(state.clazz)}<br><b>Body:</b> ${state.score}/30<br><b>Známka:</b> ${z}</div><div class="row"><button class="btn" data-act="home">HLAVNÍ MENU</button></div></div>`,'test')}
function finishChallenge(){clearTimer();state.screen='finish';sendResult(1,state.correct+state.wrong,'VÝZVA');render(`<div class="card"><div class="result"><b>Dokázal jsi doplnit 30 souhláskových skupin za sebou správně, a tak máš jedničku!</b></div><div class="row"><button class="btn challengeBtn" data-act="home">HLAVNÍ MENU</button></div></div>`,'challenge')}
function buildPayload(z,total,kind){return{timestamp:new Date().toISOString(),jmeno:state.name,trida:state.clazz,znamka:z,rezim:kind.toLowerCase(),oddil:'souhláskové skupiny',body:state.score,celkem:total,spravne:state.correct,spatne:state.wrong,poznamka:state.cheated?'PODVOD':kind,sheetId:SHEET_ID,app:'Lovci souhláskových skupin'}}
function sendResult(z,total,kind,urgent=false){if(state.finishSent&&!urgent)return;state.finishSent=true;const p=buildPayload(z,total,kind),params=new URLSearchParams();Object.entries(p).forEach(([k,v])=>params.append(k,String(v??'')));try{if(urgent&&navigator.sendBeacon){navigator.sendBeacon(GAS_WEB_APP_URL,new Blob([params.toString()],{type:'application/x-www-form-urlencoded'}))}else fetch(GAS_WEB_APP_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:params.toString(),keepalive:true})}catch(e){}}
function activeProtected(){return ['test','challenge'].includes(state.mode)&&state.screen==='question'}
function cheatFinish(reason){soundCheat();if(!activeProtected())return;state.cheated=true;state.locked=true;state.screen='finish';clearTimer();sendResult(6,state.mode==='test'?30:state.correct+state.wrong,'PODVOD: '+reason,true);render(`<div class="card cheat"><h1 class="title">PODVOD</h1><div class="result">Pokus byl ukončen kvůli opuštění testovacího okna.<br><b>Známka: 6</b></div><div class="row"><button class="btn" data-act="home">HLAVNÍ MENU</button></div></div>`,state.mode)}
let audioCtx=null;function unlockAudio(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
function tone(freq,dur,gain=.08,type='sine',delay=0){try{unlockAudio();if(!audioCtx)return;const t=audioCtx.currentTime+delay,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+dur+.03)}catch(e){}}
function soundCorrect(){tone(720,.08,.06);tone(980,.10,.05,'sine',.07)}function soundWrong(){tone(150,.20,.22,'square');tone(110,.23,.20,'sawtooth',.17)}function soundCheat(){tone(95,.65,.28,'sawtooth');tone(70,.65,.24,'square',.35)}
document.addEventListener('visibilitychange',()=>{if(document.hidden)cheatFinish('přepnutí mimo stránku')});window.addEventListener('pagehide',()=>cheatFinish('opuštění stránky'));window.addEventListener('beforeunload',e=>{if(activeProtected()){e.preventDefault();e.returnValue=''}});window.addEventListener('blur',()=>setTimeout(()=>{if(activeProtected()&&document.visibilityState==='visible'&&!document.hasFocus())cheatFinish('ztráta aktivního okna')},650));
const actions={home,nameChallenge:()=>nameScreen('challenge'),nameTest:()=>nameScreen('test')};
console.assert(QUESTIONS.length===143,`Databáze má ${QUESTIONS.length} položek místo 143.`);console.assert(QUESTIONS.every(q=>(q.text.match(/_/g)||[]).length===1&&q.answer), 'Chyba ve formátu databáze.');home();
</script></body></html>
